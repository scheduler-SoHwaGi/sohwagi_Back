spring.application.name=sohwagi

openai.model=gpt-4o
openai.api.key=${apiKey}
openai.api.url=https://api.openai.com/v1/chat/completions

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_ENDPOINT}:3306/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.access.secret.key=${JWT_ACCESS_SECRET_KEY}
jwt.refresh.secret.key=${JWT_REFRESH_SECRET_KEY}

apple.signin.client.id=${CLIENT_ID}
apple.signin.team.id=${TEAM_ID}
apple.signin.key.id=${KEY_ID}
apple.signin.audience=https://appleid.apple.com
apple.signin.private.key=${PRIVATEKEY_CONTENT}
apple.signin.grant.type=authorization_code
